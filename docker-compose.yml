version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=navdrishti_jwt_super_secret_key_sih26248_production_grade
      - JWT_REFRESH_SECRET=navdrishti_refresh_super_secret_key_sih26248_production_grade
      - CORS_ORIGIN=http://localhost:3000
      - CLIENT_URL=http://localhost:3000
      - COOKIE_SECURE=false
    volumes:
      - api_data:/app/apps/api/prisma
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
